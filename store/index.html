<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grow Club in store · Gini &amp; Jony CRM model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAFAF8;--panel:#FFFFFF;--ink:#0F0F0F;--ink2:#4A4A4A;--mute:#767676;--line:#ECECEA;--soft:#F6F6F4;--sun:#F7E64A;--green:#2E8B57;--red:#B8321F;
  --glass:rgba(255,255,255,.86);--shadow:0 10px 30px -14px rgba(0,0,0,.28);color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121212;--panel:#181818;--ink:#F2F2F2;--ink2:#C4C4C4;--mute:#9A9A9A;--line:#2C2C2C;--soft:#202020;--glass:rgba(24,24,24,.86);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121212;--panel:#181818;--ink:#F2F2F2;--ink2:#C4C4C4;--mute:#9A9A9A;--line:#2C2C2C;--soft:#202020;--glass:rgba(24,24,24,.86);color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;letter-spacing:.005em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
/* header */
header{display:flex;align-items:center;gap:20px;padding:0 24px;height:64px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{flex:none;display:flex;flex-direction:column;line-height:1.1}
.brand b{font-weight:500;font-size:1.15rem;letter-spacing:-.01em}
.brand span{font-size:.72rem;color:var(--mute);margin-top:3px}
.scenes{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;height:100%;align-items:stretch;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent 100%);padding:0 16px}
.scenes::-webkit-scrollbar{display:none}
.scenes button{flex:none;position:relative;display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--mute);white-space:nowrap;transition:color .2s}
.scenes button .n{font-size:.68rem;letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--mute)}
.scenes button:hover{color:var(--ink)}
.scenes button[aria-current="true"]{color:var(--ink);font-weight:500}
.scenes button[aria-current="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--sun)}
.applink{flex:none;display:inline-flex;align-items:center;gap:8px;font-size:.8rem;font-weight:500;color:var(--ink);text-decoration:none;height:36px;padding:0 16px;border-radius:999px;background:var(--ink);color:var(--panel)}
.applink:hover{opacity:.88}
.applink svg{width:14px;height:14px}
/* layout */
.main{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
.stage{position:relative;min-height:0;overflow:hidden;background:linear-gradient(#EEF2F4,#F3F1EC)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.labels{position:absolute;inset:0;pointer-events:none}
.leaders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.labels.off .lbl{display:none!important}
/* 3D labels */
.lbl{position:absolute;z-index:2;font-size:11px;font-weight:500;letter-spacing:.01em;white-space:nowrap;padding:4px 10px 4px 9px;border-radius:999px;background:#FFFFFF;color:#0F0F0F;box-shadow:0 3px 10px -3px rgba(0,0,0,.25);display:flex;align-items:center;gap:6px}
.lbl.fx::before{content:"";width:6px;height:6px;border-radius:50%;background:#C9C9C9;flex:none}
.lbl.fx.hl{background:#F7E64A;color:#0F0F0F}
.lbl.fx.hl::before{background:#0F0F0F}
.lbl.actor{background:#0F0F0F;color:#FFFFFF;padding:4px 11px}
.say{position:absolute;z-index:3;max-width:250px;background:#FFFFFF;color:#0F0F0F;padding:11px 14px 12px;font-size:12.5px;line-height:1.45;border-radius:14px;box-shadow:0 14px 34px -14px rgba(0,0,0,.4)}
.say b{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#767676;font-weight:500;margin-bottom:3px}
/* toolbar */
.tools{position:absolute;left:16px;top:16px;display:flex;flex-direction:column;gap:2px;padding:6px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:16px;box-shadow:var(--shadow)}
.tools button{position:relative;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:0;color:var(--ink);transition:background .15s,color .15s}
.tools button:hover{background:var(--soft)}
.tools button svg{width:18px;height:18px;stroke-width:1.6}
.tools button[aria-pressed="true"]{background:#0F0F0F;color:#F7E64A}
.tools .sep{height:1px;background:var(--line);margin:4px 6px}
.tools button[data-tip]:hover::after,.tools button[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:48px;top:50%;transform:translateY(-50%);background:#0F0F0F;color:#FFFFFF;font-size:11.5px;font-weight:500;letter-spacing:.01em;white-space:nowrap;padding:6px 10px;border-radius:8px;pointer-events:none;z-index:10}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hint,.illu{position:absolute;bottom:14px;font-size:.7rem;color:var(--ink2);background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:6px 12px;border-radius:999px}
.hint{left:16px}.illu{right:16px}
.illu span{margin-left:6px;color:var(--mute)}
.legend{position:absolute;right:16px;bottom:52px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:14px;padding:12px 14px;font-size:.76rem;color:var(--ink);display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.legend[hidden]{display:none}
.legend b{font-weight:500;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.legend span{display:flex;align-items:center;gap:9px}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.sub{position:absolute;left:50%;transform:translateX(-50%);bottom:56px;max-width:min(720px,76%);margin:0;background:rgba(15,15,15,.88);color:#fff;padding:12px 18px;border-radius:14px;font-size:.92rem;line-height:1.5;text-align:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sub[hidden]{display:none}
.sub b{color:#F7E64A;font-weight:500}
/* panel */
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.pbody{flex:1;overflow-y:auto;padding:28px 28px 24px}
.kicker{display:flex;align-items:center;gap:10px;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:500}
.kicker .k-scene{color:var(--ink)}
.kicker .k-step{margin-left:auto;letter-spacing:.06em;text-transform:none;font-size:.74rem}
.bar{display:block;width:28px;height:3px;background:var(--sun);margin:10px 0 14px}
h1{font-size:1.75rem;font-weight:500;letter-spacing:-.022em;line-height:1.12;margin:0 0 10px}
.cap{color:var(--ink2);font-size:.95rem;line-height:1.6;margin:0}
.idea{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:.76rem;color:var(--ink2);background:var(--soft);padding:6px 12px;border-radius:999px}
.idea i{width:6px;height:6px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.sec{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:500;margin:28px 0 12px;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.devices{display:grid;grid-template-columns:156px 1fr;gap:14px;align-items:start}
.dev-k{font-size:.72rem;color:var(--mute);margin-bottom:8px}
.phone{width:156px;height:312px;background:#0F0F0F;border-radius:28px;padding:5px;position:relative;box-shadow:0 14px 30px -18px rgba(0,0,0,.6)}
.phone .scr{background:#fff;color:#111;height:100%;border-radius:23px;overflow:hidden;display:flex;flex-direction:column;font-size:10.5px;line-height:1.38}
.phone.off .scr{background:#1E1E1E;color:#8A8A8A;align-items:center;justify-content:center;text-align:center;padding:14px;font-size:10.5px}
.tablet{background:#0F0F0F;border-radius:16px;padding:6px;box-shadow:0 14px 30px -18px rgba(0,0,0,.6)}
.tablet .scr{background:#fff;color:#111;border-radius:11px;min-height:156px;padding:11px 12px;font-size:10.5px;line-height:1.4}
.tablet.off .scr{background:#1E1E1E;color:#8A8A8A;display:flex;align-items:center;justify-content:center;text-align:center}
.crm{margin-top:4px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel)}
.crm-h{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:baseline;font-size:.86rem;font-weight:500}
.crm-h span{color:var(--mute);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.crm-b{padding:0 16px 6px}
.crm-r{display:grid;grid-template-columns:118px 1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:.82rem;align-items:baseline}
.crm-r span{color:var(--mute)}
.crm-r b{font-weight:500}
.crm-r i{font-style:normal;font-size:.58rem;letter-spacing:.12em;background:var(--sun);color:#111;padding:2px 7px;border-radius:999px;font-weight:600}
.crm-r i.none{background:transparent;padding:0}
.crm-note{font-size:.8rem;color:var(--ink2);line-height:1.5;padding:12px 16px 14px;background:var(--soft)}
/* controls */
.ctl{border-top:1px solid var(--line);padding:16px 28px 18px;display:flex;flex-direction:column;gap:14px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--panel)}
.ctl-row{display:flex;gap:10px;align-items:center}
.ctl-row .nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:background .15s}
.ctl-row .nav:hover{background:var(--soft)}
.ctl-row .nav svg{width:16px;height:16px}
.ctl-row .pp{flex:1;height:44px;border-radius:999px;background:#0F0F0F;color:#FFFFFF;font-weight:500;font-size:.9rem;display:flex;align-items:center;justify-content:center;gap:10px}
.ctl-row .pp svg{width:14px;height:14px;fill:#F7E64A}
.ctl-row button:disabled{opacity:.3;cursor:not-allowed}
.dots{display:flex;gap:8px;align-items:center}
.dots .seg{display:flex;gap:2px;flex:1}
.dots .seg button{flex:1;height:16px;display:flex;align-items:center}
.dots .seg button i{display:block;width:100%;height:3px;border-radius:2px;background:var(--line);transition:background .2s,height .2s}
.dots .seg button.done i{background:var(--ink)}
.dots .seg button.on i{background:var(--sun);height:5px;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.prog{font-size:.72rem;color:var(--mute);display:flex;justify-content:space-between}
@media (max-width:900px){
  html,body{height:auto}
  .app{height:auto;min-height:100%}
  header{gap:14px;padding:0 14px;height:56px}
  .brand span{display:none}
  .applink{display:none}
  .main{grid-template-columns:1fr;grid-template-rows:56vh auto}
  aside{border-left:0;border-top:1px solid var(--line);min-height:auto}
  .pbody{overflow:visible;padding:22px 18px 18px}
  .ctl{position:sticky;bottom:0;z-index:5;box-shadow:0 -10px 24px -18px rgba(0,0,0,.35);padding:12px 18px 14px}
  .tools{flex-direction:row;flex-wrap:wrap;left:10px;top:10px;right:10px;width:max-content;max-width:calc(100% - 20px);border-radius:14px}
  .tools .sep{width:1px;height:auto;margin:6px 2px}
  .tools button[data-tip]:hover::after{display:none}
  .hint{display:none}
  .illu{font-size:.62rem;left:10px;right:auto;bottom:10px}
  .legend{bottom:44px;right:10px;font-size:.68rem}
  .devices{grid-template-columns:156px 1fr}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* device mock-ups */
.s-h{font-weight:500;font-size:12px;margin:0 0 4px}
.s-k{font-size:8.5px;letter-spacing:.1em;color:#767676;text-transform:uppercase}
.s-row{display:flex;justify-content:space-between;gap:6px;padding:3px 0;border-bottom:1px solid #EFEFEF}
.s-row:last-child{border-bottom:0}
.s-btn{display:block;text-align:center;background:#111;color:#fff;padding:6px;margin-top:6px;font-size:10px;font-weight:500;border-radius:2px}
.s-btn.out{background:#fff;color:#111;border:1px solid #CFCFCF}
.s-btn.sun{background:#F7E64A;color:#111}
.s-ok{background:#F7E64A;padding:6px 8px;margin-top:6px;font-weight:500;border-radius:2px}
.s-good{background:#E7F4EC;color:#14532D;padding:6px 8px;margin-top:6px;font-weight:500;border-radius:2px}
.wa-top{background:#F2F2F2;padding:8px 9px 6px;display:flex;align-items:center;gap:6px;border-bottom:1px solid #E5E5E5}
.wa-av{width:18px;height:18px;border-radius:50%;background:#111;color:#F7E64A;font-size:7px;display:grid;place-items:center;font-weight:600;flex:none}
.wa-body{flex:1;background:#ECECEC;padding:7px;display:flex;flex-direction:column;gap:5px}
.bub{background:#fff;border-radius:2px 8px 8px 8px;padding:5px 7px;max-width:92%}
.bub.me{align-self:flex-end;background:#F7E64A;border-radius:8px 2px 8px 8px}
.bub-b{background:#fff;border-radius:6px;text-align:center;padding:4px;font-weight:500;color:#111}
.app-top{padding:8px 9px 5px;border-bottom:1px solid #EFEFEF;font-weight:500;font-size:11px}
.app-top small{display:block;font-size:7.5px;color:#767676;font-weight:400}
.app-b{padding:8px 9px;flex:1;display:flex;flex-direction:column;gap:3px}
.tg{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid #F0F0F0}
.sw{width:20px;height:11px;border-radius:6px;background:#111;position:relative;flex:none}
.sw::after{content:"";position:absolute;right:1.5px;top:1.5px;width:8px;height:8px;border-radius:50%;background:#fff}
.sw.off{background:#D5D5D5}.sw.off::after{right:auto;left:1.5px}
.mini-ruler{height:3px;background:#E6E6E6;border-radius:2px;position:relative;margin:8px 0 4px}
.mini-ruler i{position:absolute;left:0;top:0;bottom:0;background:#F7E64A;border-radius:2px}
.mini-ruler b{position:absolute;top:-4px;width:10px;height:10px;border-radius:50%;background:#111;border:2px solid #fff;margin-left:-5px}

</style>
</head>

function curve(a,b){const mid=a.clone().add(b).multiplyScalar(0.5);mid.y=Math.max(a.y,b.y)+1.6;return new THREE.QuadraticBezierCurve3(a,mid,b);}
function flowLine(a,b,group,color){const c=curve(a,b);const geo=new THREE.BufferGeometry().setFromPoints(c.getPoints(48));const l=new THREE.Line(geo,new THREE.LineDashedMaterial({color:color||0x111111,dashSize:0.18,gapSize:0.12}));l.computeLineDistances();group.add(l);return c;}

const cam={t:new THREE.Vector3(0,0.8,0),d:22,th:0.45,ph:0.95};let camFrom=null,camTo=null,camT=1;
function camApply(){const s=Math.sin(cam.ph);camera.position.set(cam.t.x+cam.d*s*Math.sin(cam.th),cam.t.y+cam.d*Math.cos(cam.ph),cam.t.z+cam.d*s*Math.cos(cam.th));camera.lookAt(cam.t);}
function camGo(c){camFrom={t:cam.t.clone(),d:cam.d,th:cam.th,ph:cam.ph};camTo={t:new THREE.Vector3(c[0],c[1],c[2]),d:c[3],th:c[4],ph:c[5]};let dth=camTo.th-camFrom.th;while(dth>Math.PI)dth-=2*Math.PI;while(dth<-Math.PI)dth+=2*Math.PI;camTo.th=camFrom.th+dth;camT=FAST?0.999:0;}
let drag=null;
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,pan:e.button===2||e.shiftKey};canvas.setPointerCapture(e.pointerId);camT=1;});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
  if(drag.pan){const r=new THREE.Vector3().subVectors(camera.position,cam.t).normalize();const right=new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0),r).normalize();const f=cam.d*0.0015;cam.t.addScaledVector(right,-dx*f);cam.t.y=Math.max(0,Math.min(6,cam.t.y+dy*f));cam.t.x=Math.max(-14,Math.min(14,cam.t.x));cam.t.z=Math.max(-10,Math.min(12,cam.t.z));}
  else{cam.th-=dx*0.006;cam.ph=Math.max(0.12,Math.min(1.42,cam.ph-dy*0.005));}userMoved();});

let labelMode='key';const lblEls={};
function lbl(id,cls){if(!lblEls[id]){const d=document.createElement('div');d.className='lbl '+cls;labelsEl.appendChild(d);lblEls[id]=d;}return lblEls[id];}
const sayEl=document.createElement('div');sayEl.className='say';sayEl.style.display='none';labelsEl.appendChild(sayEl);
function project(v){const p=v.clone().project(camera);const r=stage.getBoundingClientRect();return {x:(p.x+1)/2*r.width,y:(1-p.y)/2*r.height,vis:p.z<1&&p.z>-1};}
function rectOf(el){const r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();return {x:r.left-s.left,y:r.top-s.top,w:r.width,h:r.height};}
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function layoutLabels(){
  const S=stage.getBoundingClientRect();const W=S.width,H=S.height;const occ=[];
  ['.tools','.hint','.illu','#legend','#sub'].forEach(sel=>{const e=document.querySelector(sel);if(e&&e.offsetParent)occ.push(rectOf(e));});
  let lines='';const items=[];
  const st=STEPS[cur];
  if(st&&st.say&&A[st.say[0]].visible){const a=A[st.say[0]];items.push({el:sayEl,pri:0,anchor:project(a.position.clone().add(new THREE.Vector3(0,a.userData.h+0.12,0))),gap:14,leader:true});}else sayEl.style.display='none';
  Object.entries(A).forEach(([k,a])=>{const el=lbl('a_'+k,'actor');if(el.textContent!==a.userData.label)el.textContent=a.userData.label;if(!a.visible){el.style.display='none';return;}items.push({el,pri:1,anchor:project(a.position.clone().add(new THREE.Vector3(0,a.userData.h+0.12,0))),gap:6,leader:true});});
  Object.entries(fixtures).forEach(([k,f])=>{const el=lbl('f_'+k,'fx');if(el.textContent!==f.label)el.textContent=f.label;const on=hlKeys.includes(k);el.classList.toggle('hl',on);
    if(!(on||labelMode==='all')){el.style.display='none';return;}items.push({el,pri:on?2:3,anchor:project(f.point),gap:6,leader:true,fx:true});});
  items.sort((a,b)=>a.pri-b.pri);
  const tries=[[0,0],[0,-26],[0,-52],[-70,-14],[70,-14],[0,-80],[-110,-40],[110,-40],[0,40],[-160,-10],[160,-10],[0,70],[-150,50],[150,50],[0,-110],[-200,30],[200,30]];
  items.forEach(it=>{const el=it.el;if(!it.anchor.vis||it.anchor.x<-40||it.anchor.x>W+40||it.anchor.y<-40||it.anchor.y>H+40){el.style.display='none';return;}
    el.style.display='block';const w=el.offsetWidth,h=el.offsetHeight;let placed=null;
    for(const [dx,dy] of tries){let x=it.anchor.x-w/2+dx,y=it.anchor.y-h-it.gap+dy;x=Math.max(6,Math.min(W-w-6,x));y=Math.max(6,Math.min(H-h-6,y));const r={x,y,w,h};
      if(!occ.some(o=>hit(o,{x:r.x-3,y:r.y-3,w:r.w+6,h:r.h+6}))){placed=r;break;}}
    if(!placed){if(it.pri<=1){let x=Math.max(6,Math.min(W-w-6,it.anchor.x-w/2)),y=Math.max(6,Math.min(H-h-6,it.anchor.y-h-it.gap));placed={x,y,w,h};}else{el.style.display='none';return;}}
    el.style.left=placed.x+'px';el.style.top=placed.y+'px';occ.push(placed);
    const bx=placed.x+w/2,by=placed.y+h;const far=Math.hypot(bx-it.anchor.x,by-it.anchor.y)>it.gap+8;
    if(it.fx)lines+=`<circle cx="${it.anchor.x}" cy="${it.anchor.y}" r="3" fill="#111"/>`;
    if(far&&it.leader)lines+=`<line x1="${it.anchor.x}" y1="${it.anchor.y}" x2="${Math.max(placed.x+8,Math.min(placed.x+w-8,it.anchor.x))}" y2="${it.anchor.y>placed.y?placed.y+h:placed.y}" stroke="#111" stroke-width="1" stroke-dasharray="${it.pri===0?'0':'3 2'}"/>`;});
  leaders.innerHTML=lines;
}

function segHit(ax,az,bx,bz,r){const e=1e-4;let t0=0,t1=1;const dx=bx-ax,dz=bz-az;const p=[-dx,dx,-dz,dz],q=[ax-(r[0]+e),(r[1]-e)-ax,az-(r[2]+e),(r[3]-e)-az];for(let i=0;i<4;i++){if(Math.abs(p[i])<1e-9){if(q[i]<0)return false;}else{const t=q[i]/p[i];if(p[i]<0){if(t>t1)return false;if(t>t0)t0=t;}else{if(t<t0)return false;if(t<t1)t1=t;}}}return true;}
const inside=(x,z,r)=>x>r[0]&&x<r[1]&&z>r[2]&&z<r[3];
function planPath(a,b,extra){let rects=RAW_OBST.map(infl).concat((extra||[]).map(p=>[p[0]-0.25-RAD,p[0]+0.25+RAD,p[1]-0.25-RAD,p[1]+0.25+RAD]));
  rects=rects.filter(r=>!inside(a[0],a[1],r)&&!inside(b[0],b[1],r));
  const clear=(p,q)=>!rects.some(r=>segHit(p[0],p[1],q[0],q[1],r));
  if(clear(a,b))return [b];
  const nodes=[a,b];rects.forEach(r=>{[[r[0]-0.04,r[2]-0.04],[r[1]+0.04,r[2]-0.04],[r[0]-0.04,r[3]+0.04],[r[1]+0.04,r[3]+0.04]].forEach(p=>{if(Math.abs(p[0])<9&&p[1]>-6&&p[1]<10&&!rects.some(rr=>inside(p[0],p[1],rr)))nodes.push(p);});});
  const n=nodes.length,dist=new Array(n).fill(Infinity),prev=new Array(n).fill(-1),done=new Array(n).fill(false);dist[0]=0;
  for(let it=0;it<n;it++){let u=-1;for(let i=0;i<n;i++)if(!done[i]&&(u<0||dist[i]<dist[u]))u=i;if(u<0||dist[u]===Infinity)break;done[u]=true;if(u===1)break;
    for(let v=0;v<n;v++){if(done[v])continue;const d=Math.hypot(nodes[u][0]-nodes[v][0],nodes[u][1]-nodes[v][1]);if(dist[u]+d<dist[v]&&clear(nodes[u],nodes[v])){dist[v]=dist[u]+d;prev[v]=u;}}}
  if(prev[1]<0)return [b];const path=[];let c=1;while(c>0){path.unshift(nodes[c]);c=prev[c];}return path;}
const PRIO={S:3,P:2,N:2,C:1};const SPEED={S:1.3,P:1.25,N:1.0,C:1.2};
const region=z=>z>18?'home':'world';
function setActors(act){const tg={};Object.entries(act||{}).forEach(([k,p])=>{if(p)tg[k]=p;});
  const fresh=Object.keys(tg).filter(k=>!A[k].visible&&k!=='S'&&region(tg[k][1])!=='home').sort((x,y)=>tg[x][0]-tg[y][0]);const entry={};fresh.forEach((k,i)=>{entry[k]=(i-(fresh.length-1)/2)*0.95;});
  Object.entries(A).forEach(([k,a])=>{const u=a.userData;const p=tg[k];if(!p){a.visible=false;u.phone.visible=false;u.path=[];u.moving=false;return;}
    const target=[p[0],p[1]];
    if(!a.visible){a.visible=true;if(k==='S'||region(p[1])==='home'||FAST)a.position.set(p[0],0,p[1]);else if(p[1]<5)a.position.set(entry[k]||0,0,7.6);else a.position.set(p[0]+(entry[k]||0)*0.6,0,8.9);}
    else if(region(a.position.z)!==region(p[1])||FAST){a.position.set(p[0],0,p[1]);}
    const others=Object.entries(tg).filter(([o])=>o!==k).map(([,q])=>q);
    u.path=(Math.hypot(a.position.x-p[0],a.position.z-p[1])<0.02)?[]:planPath([a.position.x,a.position.z],target,others);u.moving=u.path.length>0;u.wait=0;});}
function stepActors(dt,st){
  Object.entries(A).forEach(([k,a])=>{const u=a.userData;let moving=false;
    if(a.visible&&u.path&&u.path.length){const nx=u.path[0];const dx=nx[0]-a.position.x,dz=nx[1]-a.position.z;const d=Math.hypot(dx,dz);const step=Math.min(d,SPEED[k]*dt);
      const npx=a.position.x+dx/(d||1)*step,npz=a.position.z+dz/(d||1)*step;let blocked=false;
      for(const [o,b] of Object.entries(A)){if(o===k||!b.visible)continue;const dn=Math.hypot(npx-b.position.x,npz-b.position.z),dc=Math.hypot(a.position.x-b.position.x,a.position.z-b.position.z);if(dn<0.62&&dn<dc&&b.userData.moving&&PRIO[o]>PRIO[k]){blocked=true;break;}}
      if(blocked&&u.wait<3){u.wait+=dt;}else{a.position.x=npx;a.position.z=npz;moving=true;const want=Math.atan2(dx,dz);let dr=want-a.rotation.y;while(dr>Math.PI)dr-=2*Math.PI;while(dr<-Math.PI)dr+=2*Math.PI;a.rotation.y+=dr*Math.min(1,dt*10);if(d<=SPEED[k]*dt+1e-4)u.path.shift();}
      if(blocked)moving=false;}
    u.moving=!!(u.path&&u.path.length);
    if(!u.moving&&a.visible){const pairs={S:['P','N'],P:['S','C'],C:['P'],N:['S']};let tgt=null;for(const o of pairs[k]){const b=A[o];if(b.visible&&b.position.distanceTo(a.position)<4.5){tgt=b;break;}}
      if(tgt){const want=Math.atan2(tgt.position.x-a.position.x,tgt.position.z-a.position.z);let d=want-a.rotation.y;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;a.rotation.y+=d*(FAST?1:0.1);}}
    u.walk=moving?u.walk+dt*9:0;const sw=moving?Math.sin(u.walk)*0.55:0;u.legs[0].rotation.x=sw;u.legs[1].rotation.x=-sw;u.arms[0].rotation.x=-sw*0.8;
    const usePhone=!u.moving&&((k==='P'&&st.phone&&st.phone[0]!=='off'&&st.phone[0]!=='card')||(k==='N'&&st.phone&&st.phone[0]==='card'));
    u.phone.visible=usePhone;u.arms[1].rotation.x=usePhone?-1.25:sw*0.8;u.arms[1].rotation.z=usePhone?0.25:0;
    a.position.y=moving?Math.abs(Math.sin(u.walk))*0.03:0;});}

function go(i){
  cur=Math.max(0,Math.min(STEPS.length-1,i));const st=STEPS[cur];
  camGo(st.cam);setActors(st.act);setHL(st.hl||[]);setFlows(st.flows||[]);allFlowGroup.visible=!!st.allFlows||flowsAll;
  shelfBags.forEach(b=>b.visible=!!st.bags);
  ring.visible=false;if(st.hl&&st.hl.length){const f=fixtures[st.hl[0]];ring.position.set(f.point.x,0.075,f.point.z);ring.visible=f.point.y<4.5&&Math.abs(f.point.x)<8;}
  if(st.say)sayEl.innerHTML=`<b>${esc(A[st.say[0]].userData.label)}</b>${esc(st.say[1])}`;
  renderPanel();renderCtl();
  const subEl=$('#sub');subEl.innerHTML=`<b>${esc(st.t)}</b> ${esc(st.b)}`;subEl.hidden=!narrate;
  clearTimeout(timer);const next=()=>{if(!playing)return;if(cur<STEPS.length-1)go(cur+1);else{playing=false;renderCtl();}};
  if(narrate){const t0=performance.now();speak(st,()=>{if(playing)timer=setTimeout(next,Math.max(800,STEP_MS-(performance.now()-t0)));});}
  else if('speechSynthesis' in window)speechSynthesis.cancel();
  if(playing&&!narrate){if(cur<STEPS.length-1)timer=setTimeout(next,STEP_MS);else{playing=false;renderCtl();}}
}
function sceneName(i){return SC[i].name.split(' · ')[1]||SC[i].name;}
function renderPanel(){const st=STEPS[cur];const sceneSteps=STEPS.filter(x=>x.s===st.s);const k=sceneSteps.indexOf(st)+1;const nn=String(st.s+1).padStart(2,'0');
  $('#pbody').innerHTML=`<div class="kicker"><span class="k-scene">Scene ${nn}</span><span>${esc(sceneName(st.s))}</span><span class="k-step">Step ${k} of ${sceneSteps.length}</span></div><span class="bar" aria-hidden="true"></span>
  <h1 aria-live="polite">${esc(st.t)}</h1><p class="cap">${esc(st.b)}</p><div class="idea"><i aria-hidden="true"></i>${esc(st.idea)}</div>
  <div class="sec">On the devices</div><div class="devices"><div><div class="dev-k">Parent’s phone</div>${deviceHTML(st.phone,PH,'phone')}</div><div><div class="dev-k">Staff tablet</div>${deviceHTML(st.tablet,TB,'tablet')}</div></div>
  <div class="sec">In the CRM</div><div class="crm"><div class="crm-h">Household record<span>What gets stored</span></div><div class="crm-b">${st.crm.rows.map(([a,b,n])=>`<div class="crm-r"><span>${esc(a)}</span><b>${esc(b)}</b>${n?'<i>NEW</i>':'<i class="none"></i>'}</div>`).join('')}</div><div class="crm-note">${esc(st.crm.note)}</div></div>`;
  $('#pbody').scrollTop=0;}
function renderCtl(){
  const lbl=playing?'Pause':(cur>=STEPS.length-1?'Replay':'Play');const ico=playing?'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z"/></svg>';
  $('#bPlay').innerHTML=ico+lbl;$('#bPrev').disabled=cur===0;$('#bNext').disabled=cur===STEPS.length-1;
  let html='';SC.forEach((sc,si)=>{html+='<div class="seg">';STEPS.forEach((x,i)=>{if(x.s!==si)return;html+=`<button type="button" data-i="${i}" aria-label="Step ${i+1}: ${esc(x.t)}" class="${i===cur?'on':i<cur?'done':''}"><i></i></button>`;});html+='</div>';});
  $('#dots').innerHTML=html;$('#prog').innerHTML=`<span>Step ${cur+1} of ${STEPS.length}</span><span>${playing?'Playing':'Paused'} · ← → keys</span>`;
  $('#scenes').innerHTML=SC.map((s,i)=>`<button type="button" data-s="${i}" aria-current="${STEPS[cur].s===i}"><span class="n">${String(i+1).padStart(2,'0')}</span>${esc(sceneName(i))}</button>`).join('');
  const act=$('#scenes [aria-current="true"]');if(act&&act.scrollIntoView)act.scrollIntoView({block:'nearest',inline:'nearest'});}
$('#bPrev').onclick=()=>{playing=false;go(cur-1);};
$('#bNext').onclick=()=>{playing=false;go(cur+1);};
$('#bPlay').onclick=()=>{if(playing){playing=false;clearTimeout(timer);if('speechSynthesis' in window)speechSynthesis.cancel();renderCtl();return;}playing=true;go(cur>=STEPS.length-1?0:cur+1);};
$('#dots').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b){playing=false;go(+b.dataset.i);}});
$('#scenes').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b){playing=false;go(sceneFirst(+b.dataset.s));}});
$('#tFit').onclick=()=>camGo(STEPS[cur].cam);
$('#tLabels').onclick=e=>{labelMode=labelMode==='key'?'all':labelMode==='all'?'off':'key';{const t=labelMode==='key'?'Labels: key touchpoints':labelMode==='all'?'Labels: all':'Labels: off';e.currentTarget.querySelector('span').textContent=t;e.currentTarget.dataset.tip=t;e.currentTarget.setAttribute('aria-label',t);}e.currentTarget.setAttribute('aria-pressed',labelMode!=='off');labelsEl.classList.toggle('off',labelMode==='off');};
let flowsAll=false;$('#tFlows').onclick=e=>{flowsAll=!flowsAll;e.currentTarget.setAttribute('aria-pressed',flowsAll);allFlowGroup.visible=flowsAll||!!STEPS[cur].allFlows;};
let xray=false;$('#tWalls').onclick=e=>{xray=!xray;e.currentTarget.setAttribute('aria-pressed',xray);};
$('#tStyle').onclick=()=>applyStyle(STYLE==='real'?'sketch':'real');
$('#tData').onclick=e=>{dataMap.visible=!dataMap.visible;e.currentTarget.setAttribute('aria-pressed',dataMap.visible);$('#legend').hidden=!dataMap.visible;};
$('#tVoice').onclick=e=>{narrate=!narrate;e.currentTarget.setAttribute('aria-pressed',narrate);if(!('speechSynthesis' in window)&&narrate){$('#sub').hidden=false;}go(cur);};
$('#tPresent').onclick=()=>{const el=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});};
function wallsAuto(){const c=camera.position;walls.forEach(w=>{if(w.userData.side==='G')return;const sd=w.userData.side;const see=xray||(sd==='R'&&c.x>7.1)||(sd==='L'&&c.x<-7.1)||(sd==='B'&&c.z<-5.1)||(sd==='F'&&c.z>5.1&&c.y<1.4);const op=see?0.1:1;if(w.material.opacity!==op){w.material.transparent=see;w.material.opacity=op;w.material.depthWrite=!see;w.material.needsUpdate=true;w.castShadow=!see;w.children.forEach(ch=>{if(ch.isLineSegments)ch.visible=!see||xray;});if(w.userData.capMesh)w.userData.capMesh.visible=!see;}});
  paints.forEach(p=>{const sd=p.userData.side;p.visible=!(xray||(sd==='L'&&c.x<-7.1)||(sd==='B'&&c.z<-5.1));});
  nbR.visible=!(c.x>7.2&&c.z<5.4);nbL.visible=!(c.x<-7.2&&c.z<5.4);nbB.visible=!(c.z<-5.2);nbO.visible=!(c.z>18.6);homeShell.visible=!(c.z>18.6&&c.x<-2&&c.x>-10);
  const low=c.z>5.1&&c.y<6.2;fascia.visible=!low;fasciaSigns.forEach(m=>m.visible=!low);}
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,select,textarea'))return;if(e.key==='ArrowRight'){playing=false;go(cur+1);}if(e.key==='ArrowLeft'){playing=false;go(cur-1);}if(e.key===' '&&e.target===document.body){e.preventDefault();$('#bPlay').click();}});

/* ================= loop ================= */
function resize(){const r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/Math.max(1,r.height);camera.updateProjectionMatrix();sizeComposer();}
window.addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let last=performance.now();
function tick(now){const dt=Math.min(0.1,(now-last)/1000);last=now;const tt=now/1000;
  if(camT<1&&camTo){camT=Math.min(1,camT+dt/(reduce||FAST?0.01:1.4));const e=ease(camT);cam.t.lerpVectors(camFrom.t,camTo.t,e);cam.d=camFrom.d+(camTo.d-camFrom.d)*e;cam.th=camFrom.th+(camTo.th-camFrom.th)*e;cam.ph=camFrom.ph+(camTo.ph-camFrom.ph)*e;}
  camApply();wallsAuto();
  const st=STEPS[cur];
  stepActors(dt,st);
  packets.forEach(p=>{const u=((tt*0.45)+p.off)%1;p.mesh.position.copy(p.curve.getPoint(u));});
  if(ring.visible){const s=1+0.1*Math.sin(tt*3);ring.scale.set(s,s,s);ring.material.opacity=0.55+0.35*Math.sin(tt*3);}
  renderFrame();perfSample(dt);layoutLabels();requestAnimationFrame(tick);}
window.GC={applyStyle,get useAO(){return useAO},setAO(v){useAO=v;},renderer,go,STEPS,A,fixtures,camera,scene,walls,cam,get cur(){return cur;},layoutLabels};
buildComposer();applyStyle('real');resize();go(0);requestAnimationFrame(tick);
})();

</script>
